name: iOS Build & App Store Upload

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to TestFlight / App Store Connect?'
        required: true
        type: boolean
        default: false

jobs:
  build-ios:
    name: Build & Export iOS App
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Build iOS Archive (Xcodebuild)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Prepare IPA Package
        run: |
          mkdir -p build/Payload
          cp -r ios/App/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r StreetStriker-iOS.ipa Payload
          echo "IPA created successfully at build/StreetStriker-iOS.ipa"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreetStriker-iOS-Build
          path: build/StreetStriker-iOS.ipa
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight (If Configured)
        if: ${{ github.event.inputs.upload_to_testflight == 'true' || env.APP_STORE_CONNECT_API_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_KEY_CONTENT" ]; then
            echo "Saving App Store Connect Auth Key..."
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APP_STORE_CONNECT_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
            
            echo "Validating & Uploading IPA to Apple..."
            xcrun altool --upload-app \
                         -f build/StreetStriker-iOS.ipa \
                         -t ios \
                         --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
                         --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          else
            echo "No Apple API Key configured in GitHub Secrets yet. Skipping auto-upload."
          fi
