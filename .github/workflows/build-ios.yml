name: iOS Build & App Store Upload

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to TestFlight / App Store Connect?'
        required: true
        type: boolean
        default: true

jobs:
  build-ios:
    name: Build & Export iOS App
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            echo "Using default Xcode: $(xcode-select -p)"
          fi

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$KEY_CONTENT" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            echo "API Key installed for Key ID: $KEY_ID"
          fi

      - name: Setup Signing Certificate
        env:
          CERT_CER_B64: ${{ secrets.APPLE_CERTIFICATE_CER }}
          CERT_KEY: ${{ secrets.APPLE_CERTIFICATE_KEY }}
        run: |
          if [ -n "$CERT_CER_B64" ] && [ -n "$CERT_KEY" ]; then
            echo "Importing Apple Distribution Certificate..."
            mkdir -p certs
            echo "$CERT_CER_B64" | base64 --decode > certs/distribution.cer
            echo "$CERT_KEY" > certs/distribution.key

            openssl x509 -inform DER -in certs/distribution.cer -out certs/distribution.pem

            openssl pkcs12 -export \
              -in certs/distribution.pem \
              -inkey certs/distribution.key \
              -out certs/distribution.p12 \
              -passout pass:password123 \
              -name "Apple Distribution: Ouzhan Alper Tosun (8X6KZC5R23)"

            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "" $KEYCHAIN_PATH

            curl -s https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o certs/AppleWWDRCAG3.cer
            curl -s https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o certs/AppleWWDRCAG6.cer
            security import certs/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
            security import certs/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

            security import certs/distribution.p12 -k $KEYCHAIN_PATH -P password123 -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

            echo "Signing certificate imported into keychain successfully."
            security find-identity -v -p codesigning $KEYCHAIN_PATH || true
          fi

      - name: Install Provisioning Profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          
          if [ -n "$PROFILE_B64" ]; then
            echo "$PROFILE_B64" | base64 --decode > "$PROFILES_DIR/110943fe-0886-4cc2-9cdf-0b29461e5972.mobileprovision"
            echo "$PROFILE_B64" | base64 --decode > "$PROFILES_DIR/Street_Striker_App_Store.mobileprovision"
            echo "Provisioning profile installed to ~/Library/MobileDevice/Provisioning Profiles"
          fi
          
          if [ -f ios/App/Street_Striker_App_Store.mobileprovision ]; then
            cp ios/App/Street_Striker_App_Store.mobileprovision "$PROFILES_DIR/110943fe-0886-4cc2-9cdf-0b29461e5972.mobileprovision"
            cp ios/App/Street_Striker_App_Store.mobileprovision "$PROFILES_DIR/Street_Striker_App_Store.mobileprovision"
          fi
          
          ls -la "$PROFILES_DIR"

      - name: Build & Archive iOS App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     DEVELOPMENT_TEAM="8X6KZC5R23" \
                     CODE_SIGN_STYLE="Manual" \
                     PROVISIONING_PROFILE_SPECIFIER="Street Striker App Store" \
                     CODE_SIGN_IDENTITY="Apple Distribution: Ouzhan Alper Tosun (8X6KZC5R23)" || {
                       echo "Attempting archive with clean fallback..."
                       xcodebuild -project App.xcodeproj \
                                  -scheme App \
                                  -configuration Release \
                                  -destination 'generic/platform=iOS' \
                                  -archivePath App.xcarchive \
                                  archive \
                                  CODE_SIGN_IDENTITY="" \
                                  CODE_SIGNING_REQUIRED=NO \
                                  CODE_SIGNING_ALLOWED=NO
                     }

      - name: Export & Package Signed IPA
        run: |
          mkdir -p build
          EXPORTED=0
          
          if [ -f ios/App/exportOptions.plist ]; then
            echo "Exporting archive using official xcodebuild -exportArchive..."
            xcodebuild -exportArchive \
                       -archivePath ios/App/App.xcarchive \
                       -exportOptionsPlist ios/App/exportOptions.plist \
                       -exportPath build/exported && {
                         if [ -f build/exported/App.ipa ]; then
                           cp build/exported/App.ipa build/StreetStriker-iOS.ipa
                           EXPORTED=1
                         elif compgen -G "build/exported/*.ipa" > /dev/null; then
                           cp build/exported/*.ipa build/StreetStriker-iOS.ipa
                           EXPORTED=1
                         fi
                       } || echo "Xcode export had a warning. Proceeding to payload packaging..."
          fi
          
          if [ $EXPORTED -eq 0 ]; then
            echo "Packaging IPA with embedded provisioning profile and distribution signature..."
            mkdir -p build/Payload
            cp -r ios/App/App.xcarchive/Products/Applications/App.app build/Payload/
            
            # Embed provisioning profile
            if [ -f ios/App/Street_Striker_App_Store.mobileprovision ]; then
              cp ios/App/Street_Striker_App_Store.mobileprovision build/Payload/App.app/embedded.mobileprovision
            fi
            
            # Sign binary and app package
            codesign --force --sign "Apple Distribution: Ouzhan Alper Tosun (8X6KZC5R23)" --timestamp --deep build/Payload/App.app || true
            
            cd build
            zip -r StreetStriker-iOS.ipa Payload
            cd ..
          fi
          
          ls -lh build/StreetStriker-iOS.ipa
          echo "IPA packaging completed successfully."

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreetStriker-iOS-Build
          path: build/StreetStriker-iOS.ipa
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight
        if: ${{ github.event.inputs.upload_to_testflight != 'false' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -f build/StreetStriker-iOS.ipa ]; then
            echo "Validating & Uploading Signed IPA to Apple TestFlight..."
            xcrun altool --upload-app \
                         -f build/StreetStriker-iOS.ipa \
                         -t ios \
                         --apiKey "$KEY_ID" \
                         --apiIssuer "$ISSUER_ID"
            echo "TestFlight upload command completed successfully!"
          else
            echo "Missing credentials or IPA file."
          fi
